name: Build Windows

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_NAME: StreamMulticast

jobs:
  build:
    name: Build (Windows x64, ${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [RelWithDebInfo]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64 --config ${{ matrix.config }}

      - name: Stage artifact
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path "$stage/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/data/obs-plugins/${{ env.PLUGIN_NAME }}/locale" | Out-Null
          Copy-Item "build_x64/${{ matrix.config }}/${{ env.PLUGIN_NAME }}.dll" "$stage/obs-plugins/64bit/"
          if (Test-Path "build_x64/${{ matrix.config }}/${{ env.PLUGIN_NAME }}.pdb") {
            Copy-Item "build_x64/${{ matrix.config }}/${{ env.PLUGIN_NAME }}.pdb" "$stage/obs-plugins/64bit/"
          }
          Copy-Item "data/locale/en-US.ini" "$stage/data/obs-plugins/${{ env.PLUGIN_NAME }}/locale/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-windows-x64-${{ matrix.config }}
          path: stage/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'publish-v1.0.11'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip artifact
        run: |
          cd artifacts
          for dir in */; do
            (cd "$dir" && zip -r "../../${dir%/}.zip" .)
          done
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.11
          name: StreamMulticast v1.0.11 - OBS 32.2.2
          target_commitish: ${{ github.sha }}
          files: '*.zip'
          generate_release_notes: true
          draft: false
          prerelease: false
