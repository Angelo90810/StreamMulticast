name: Build Windows

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_NAME: StreamMulticast

jobs:
  build:
    name: Build (Windows x64, ${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [RelWithDebInfo]

    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake --preset windows-ci-x64

      - name: Build
        run: cmake --build --preset windows-ci-x64 --config ${{ matrix.config }}

      - name: Run core regression tests
        shell: pwsh
        run: |
          $dllDirs = Get-ChildItem -Path ".deps" -Recurse -File -Filter "*.dll" |
            ForEach-Object { $_.DirectoryName } |
            Sort-Object -Unique
          if (-not $dllDirs) {
            throw "No runtime DLL directories found under .deps"
          }
          $env:PATH = (($dllDirs -join ";") + ";" + $env:PATH)
          ctest --test-dir build_x64 -C ${{ matrix.config }} --output-on-failure

      - name: Stage OBS plugin package
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path "$stage/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/data/obs-plugins/${{ env.PLUGIN_NAME }}/locale" | Out-Null
          Copy-Item "build_x64/${{ matrix.config }}/${{ env.PLUGIN_NAME }}.dll" "$stage/obs-plugins/64bit/"
          if (Test-Path "build_x64/${{ matrix.config }}/${{ env.PLUGIN_NAME }}.pdb") {
            Copy-Item "build_x64/${{ matrix.config }}/${{ env.PLUGIN_NAME }}.pdb" "$stage/obs-plugins/64bit/"
          }
          Copy-Item "data/locale/en-US.ini" "$stage/data/obs-plugins/${{ env.PLUGIN_NAME }}/locale/"

      - name: Validate package layout
        shell: pwsh
        run: |
          $required = @(
            "stage/obs-plugins/64bit/${{ env.PLUGIN_NAME }}.dll",
            "stage/data/obs-plugins/${{ env.PLUGIN_NAME }}/locale/en-US.ini",
            "build_x64/installer-Windows.generated.iss"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing required packaged file: $path"
            }
          }
          if (Test-Path -LiteralPath "stage/${{ env.PLUGIN_NAME }}") {
            throw "Invalid extra plugin root directory in package: stage/${{ env.PLUGIN_NAME }}"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and ZIP
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "buildspec.json" -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found"
          }

          $dist = (Resolve-Path "dist").Path
          & $iscc "build_x64/installer-Windows.generated.iss" "/O$dist"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          Compress-Archive -Force -CompressionLevel Optimal `
            -Path "stage/*" `
            -DestinationPath "dist/${{ env.PLUGIN_NAME }}-windows-x64-${{ matrix.config }}.zip"

          $installer = "dist/StreamMulticast-$version-Windows-Installer.exe"
          $zip = "dist/${{ env.PLUGIN_NAME }}-windows-x64-${{ matrix.config }}.zip"
          foreach ($path in @($installer, $zip)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Expected release asset was not generated: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Generated release asset is empty: $path"
            }
          }

          Get-FileHash -Algorithm SHA256 -Path "dist/*" |
            ForEach-Object { Write-Host "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" }

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StreamMulticast-release-assets
          path: dist/*
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'publish-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(jq -r '.version' buildspec.json)
          OBS_VERSION=$(jq -r '.dependencies["obs-studio"].version' buildspec.json)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=StreamMulticast v$VERSION - OBS $OBS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: StreamMulticast-release-assets
          path: release-assets

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
