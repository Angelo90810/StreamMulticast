name: Build Windows

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_NAME: StreamMulticast

jobs:
  build:
    name: Build (Windows x64, ${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [RelWithDebInfo]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake --preset windows-ci-x64

      - name: Build
        run: cmake --build --preset windows-ci-x64 --config ${{ matrix.config }}

      - name: Validate TikTok bridge script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/tiktok-bridge/StreamMulticast.TikTokBridge.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Smoke test TikTok bridge helper
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "streammulticast-tiktok-bridge-test.json"
          & "tools/tiktok-bridge/StreamMulticast.TikTokBridge.ps1" `
            -Name "CI Bridge" `
            -ServerUrl "rtmps://example.invalid/live" `
            -StreamKey "ci-test-key" `
            -ExpiresAt "2099-01-01T00:00:00Z" `
            -OutputPath $out
          $json = Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($json.name -ne "CI Bridge" -or
              $json.server_url -ne "rtmps://example.invalid/live" -or
              $json.stream_key -ne "ci-test-key" -or
              $json.expires_at -ne "2099-01-01T00:00:00Z") {
            throw "TikTok bridge helper wrote unexpected JSON"
          }

      - name: Stage artifact
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path "$stage/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/data/obs-plugins/${{ env.PLUGIN_NAME }}/locale" | Out-Null
          Copy-Item "build_x64/${{ matrix.config }}/${{ env.PLUGIN_NAME }}.dll" "$stage/obs-plugins/64bit/"
          if (Test-Path "build_x64/${{ matrix.config }}/${{ env.PLUGIN_NAME }}.pdb") {
            Copy-Item "build_x64/${{ matrix.config }}/${{ env.PLUGIN_NAME }}.pdb" "$stage/obs-plugins/64bit/"
          }
          Copy-Item "data/locale/en-US.ini" "$stage/data/obs-plugins/${{ env.PLUGIN_NAME }}/locale/"

      - name: Validate package layout
        shell: pwsh
        run: |
          $required = @(
            "stage/obs-plugins/64bit/${{ env.PLUGIN_NAME }}.dll",
            "stage/data/obs-plugins/${{ env.PLUGIN_NAME }}/locale/en-US.ini"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing required packaged file: $path"
            }
          }
          if (Test-Path -LiteralPath "stage/${{ env.PLUGIN_NAME }}") {
            throw "Invalid extra plugin root directory in package: stage/${{ env.PLUGIN_NAME }}"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-windows-x64-${{ matrix.config }}
          path: stage/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'publish-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(jq -r '.version' buildspec.json)
          OBS_VERSION=$(jq -r '.dependencies["obs-studio"].version' buildspec.json)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=StreamMulticast v$VERSION - OBS $OBS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip artifact
        run: |
          cd artifacts
          for dir in */; do
            (cd "$dir" && zip -r "../../${dir%/}.zip" .)
          done
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: '*.zip'
          generate_release_notes: true
          draft: false
          prerelease: false
